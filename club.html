function form({title,sub,btn,needName,onGo}){const st=LS.get();card(`${title}${sub||''}<label for="ph">📱 النمرة ديالك (واتساب)</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="06 XX XX XX XX" value="${esc(st.phone||'')}">

 const go=$('#go');go.onclick=async()=>{const ph=$('#ph').value,nm=$('#nm').value;$('#m').innerHTML='';go.disabled=true;try{const r=await onGo(ph,nm);if(r&&r.err==='name'){$('#nmw').hidden=false;$('#m').innerHTML='<div class="msg err">👋 أول مرة؟ كتب السمية ديالك باش نسجلوك</div>';$('#nm').focus()}else if(r&&r.err){$('#m').innerHTML='<div class="msg err">'+(ERR[r.err]||r.err)+'</div>'}}catch(e){$('#m').innerHTML='<div class="msg err">'+ERR.net+'</div>'}go.disabled=false};

 form({title:'<div class="em">⭐</div><h1>سجل فبرنامج الوفاء</h1>',sub:'<p class="muted">كتب النمرة ديالك باش تشوف النقاط والمشتريات ديالك، ولا تسجل إلا كانت أول مرة. ومن بعد سكاني الكود اللي فالوصل باش تزيد النقاط.</p>',btn:'✅ سجلني / شوف النقاط ديالي',needName:false,onGo:async(ph,nm)=>{const r=await rpc('club_join',{phone:ph,cname:nm||''});if(r.ok){LS.set({phone:ph});if(r.exists)return showHist(),r;done(r,'مرحبا بك فالوفاء!')}return r}})}
const fmtD=ts=>{const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+' · '+p(d.getHours())+':'+p(d.getMinutes())};

async function showHist(){const st=LS.get();if(!st.phone)return start(true);card('<p class="muted">⏳ كنحملو المشتريات ديالك…</p>');let r;try{const dp=rpc('club_fbdone',{phone:st.phone}).catch(()=>[]);r=await rpc('club_hist',{phone:st.phone});FBDONE=new Set(await dp||[])}catch(_){return card('<div class="msg err">'+ERR.net+'</div><button onclick="showHist()">🔄 عاود</button>')}
 if(!r.ok){LS.set({phone:null});return start(true)}
 const H=r.hist||[];HIST=H;const ph=normPh(st.phone);card(`${vcard(r,ph)}<p class="muted">${r.visits} زيارة · ${nf(r.total)} د.م</p>
  <button class="btn2" onclick="fbMsg()">💬 شكاية · اقتراح · ملاحظة · شكر</button>

   <div style="display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)"><span>🧾 ${esc(h.no||'')}</span><span>⭐ +${nf(h.pts)} نقطة</span></div><button class="link" style="align-self:flex-start;padding:4px 0" onclick="dlRcpt(${i})">⬇️ تحميل الوصل</button>${h.no?(FBDONE.has(h.no)?'<span class="muted" style="font-size:.85rem">✅ قيمتي هاد الشراء · شكرا</span>':`<button class="btn2" style="min-height:42px" onclick="fbRate(${i})">⭐ قيم هاد الشراء · 🎁 +10 نقاط</button>`):''}</div>`).join(''):'<p class="muted">ما كاين حتى شراء مسجل.</p>'}
  <button class="link" onclick="LS.set({phone:null});start(true)">🔁 نمرة أخرى</button>`)}
/* 💳 virtual loyalty card: shown at the till (or to the vendeuse) to collect points without typing the phone */
const normPh=p=>{const d=String(p||'').replace(/\D/g,'');if(/^00212[5-7]\d{8}$/.test(d))return '0'+d.slice(5);if(/^212[5-7]\d{8}$/.test(d))return '0'+d.slice(3);if(/^[5-7]\d{8}$/.test(d))return '0'+d;if(/^0[5-7]\d{8}$/.test(d))return d;return ''};

 return `<div class="vcard" id="vc"><div class="vtop"><div><b>MORANGO</b><br><small>💳 كارط الوفاء</small></div><small>⭐ مورانڭو</small></div>

function saveCard(){try{const st=LS.get(),ph=normPh(st.phone);if(!ph)return;const M=window.morangoQR.matrix(cardTxt(ph)),n=M.length,W=1000,H=1400,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#E02843');g.addColorStop(.6,'#B3142F');g.addColorStop(1,'#7A0E22');x.fillStyle=g;x.beginPath();x.roundRect?x.roundRect(0,0,W,H,60):x.rect(0,0,W,H);x.fill();
 x.fillStyle='#fff';x.textAlign='center';x.font='800 92px "Baloo Bhaijaan 2",sans-serif';x.fillText('MORANGO',W/2,150);x.font='600 46px "IBM Plex Sans Arabic",sans-serif';x.fillText('💳 كارط الوفاء',W/2,225);
 const Q=640,q0=(W-Q)/2,y0=290;x.fillStyle='#fff';x.beginPath();x.roundRect?x.roundRect(q0-30,y0-30,Q+60,Q+60,40):x.rect(q0-30,y0-30,Q+60,Q+60);x.fill();const m=Q/n;x.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(M[r][c])x.fillRect(q0+c*m,y0+r*m,Math.ceil(m),Math.ceil(m));
 x.fillStyle='#fff';x.font='700 64px "IBM Plex Sans Arabic",sans-serif';x.fillText(st.name||'',W/2,y0+Q+150);x.font='600 46px monospace';x.fillText(ph.replace(/(\d{2})(?=\d)/g,'$1 '),W/2,y0+Q+230);x.font='600 38px "IBM Plex Sans Arabic",sans-serif';x.fillText('وري هاد الكارط فلاكيس باش تزاد ليك النقاط',W/2,H-80);
 const a=document.createElement('a');a.download='Morango-carte-fidelite.png';a.href=cv.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove()}catch(e){alert('📸 ما قدرناش نحفظو، دير لقطة الشاشة (capture).')}}

/* ⭐ ratings + messages from the loyalty account → shop feedback inbox */

const FERR={rate:'⭐ قيم كل منتوج والخدمة',msg:'✍️ كتب الميساج ديالك',done:'✅ ديجا قيمتي هاد الشراء',limit:'⏳ صيفطتي بزاف اليوم، عاود غدا',notfound:'❓ ما لقيناش هاد الشراء',nouser:'❓ ما لقيناش الحساب',phone:ERR.phone};

async function fbSend(args,okTitle){const go=$('#fgo'),m=$('#fm');m.innerHTML='';go.disabled=true;try{const r=await rpc('club_fb',args);if(r.ok){if(args.tno)FBDONE.add(args.tno);card(`<div class="em">🙏</div><h1>${okTitle}</h1>${r.pts?`<div class="big" dir="ltr">+${r.pts}</div><p class="muted">نقطة تزادو ليك · الرصيد ديالك: <b>${r.balance}</b> نقطة</p>`:''}<p class="muted">الرسالة ديالك وصلات للمسؤول ديال مورانڭو. كنقراو كلشي باش نحسنو.</p><button onclick="showHist()">📜 رجع للمشتريات ديالي</button>`)}else m.innerHTML='<div class="msg err">'+(FERR[r.err]||r.err)+'</div>'}catch(_){m.innerHTML='<div class="msg err">'+ERR.net+'</div>'}go.disabled=false}
function fbRate(i){const h=HIST[i];if(!h)return;Object.keys(SEL).forEach(k=>delete SEL[k]);const U=[];(h.lines||[]).forEach(l=>{if(l.id&&!U.some(u=>u.id===l.id))U.push(l)});FBU=U;card(`<div class="em">⭐</div><h1>قيم الشراء ديالك</h1><p class="muted">🗓️ ${fmtD(h.ts)} · 🧾 ${esc(h.no||'')}${h.pos&&POSN[h.pos]?' · 🏪 '+POSN[h.pos]:''}</p>
 <p class="muted" style="margin:0">⭐ عطينا رأيك فكل منتوج شريتيه وربح <b>10 نقاط</b> 🎁</p>${U.map((l,j)=>`<div style="border-top:1px solid var(--line);padding-top:8px">${rateRow('i'+j,'🍰 '+esc(l.n))}</div>`).join('')}<div style="border-top:2px solid var(--line);padding-top:8px">${rateRow('s','🛍️ الخدمة والاستقبال')}</div>
 <label for="ft">✍️ بغيتي تزيد شي كلمة؟ (اختياري)</label><textarea id="ft" rows="3" maxlength="1000" style="font:inherit;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:inherit"></textarea>
 <div id="fm"></div><button id="fgo" onclick="fbRateGo('${esc(h.no||'')}')">📤 صيفط التقييم</button><button class="link" onclick="showHist()">← رجوع</button>`)}

 <div class="krow" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${FK.map(k=>`<button type="button" class="btn2" data-k="${k[0]}" onclick="pickK(this)">${k[1]} ${k[2]}</button>`).join('')}</div>
 <label for="ft">✍️ الميساج ديالك</label><textarea id="ft" rows="5" maxlength="1000" style="font:inherit;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:inherit"></textarea>
 ${rateRow('s','⭐ شنو رأيك فمورانڭو بصفة عامة؟ (اختياري)')}
 <div id="fm"></div><button id="fgo" onclick="if(!FKS){$('#fm').innerHTML='<div class=&quot;msg err&quot;>👆 ختار نوع الرسالة</div>';return}fbSend({phone:LS.get().phone,tno:null,items:null,rserv:SEL.s,kind:FKS,msg:$('#ft').value},'شكرا! وصلات الرسالة ديالك')">📤 صيفط</button><button class="link" onclick="showHist()">← رجوع</button>`)}
let HIST=[];const POSN={p1:'ميموزا · Mimoza',p2:'روان · Rawan'};

async function dlRcpt(i){const h=HIST[i];if(!h)return;try{const L=h.lines||[],W=640,F='"IBM Plex Sans Arabic",sans-serif',H=420+L.length*64+(h.disc?50:0),cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#E02843';x.fillRect(0,0,W,12);x.textAlign='center';x.fillStyle='#3B1520';x.font='800 56px "Baloo Bhaijaan 2",sans-serif';x.fillText('MORANGO',W/2,90);
 x.font='600 26px '+F;x.fillStyle='#8C6670';x.fillText((POSN[h.pos]||'')+' · '+fmtD(h.ts),W/2,132);x.fillText('وصل رقم '+(h.no||''),W/2,168);
 const line=y=>{x.strokeStyle='#F2D8DE';x.setLineDash([8,6]);x.beginPath();x.moveTo(30,y);x.lineTo(W-30,y);x.stroke();x.setLineDash([])};line(192);
 let y=240;x.direction='rtl';L.forEach(l=>{x.textAlign='right';x.fillStyle='#3B1520';x.font='600 28px '+F;let n=String(l.n||'');while(x.measureText(n).width>W-230&&n.length>4)n=n.slice(0,-2);if(n!==String(l.n||''))n+='…';x.fillText(n,W-30,y);x.font='500 22px '+F;x.fillStyle='#8C6670';x.fillText(nf(l.q)+' × '+nf(l.p)+' د.م',W-30,y+28);x.textAlign='left';x.direction='ltr';x.fillStyle='#3B1520';x.font='700 28px '+F;x.fillText(nf(l.q*l.p)+' DH',30,y+12);x.direction='rtl';y+=64});
 line(y-14);y+=26;if(h.disc){x.textAlign='right';x.font='600 26px '+F;x.fillStyle='#8C6670';x.fillText('خصم الوفاء',W-30,y);x.textAlign='left';x.direction='ltr';x.fillText('-'+nf(h.disc)+' DH',30,y);x.direction='rtl';y+=50}
 x.textAlign='right';x.fillStyle='#3B1520';x.font='800 38px '+F;x.fillText('المجموع',W-30,y+10);x.textAlign='left';x.direction='ltr';x.fillText(nf(h.total)+' DH',30,y+10);x.direction='rtl';
 x.textAlign='center';x.font='600 26px '+F;x.fillStyle='#E02843';x.fillText('⭐ +'+nf(h.pts)+' نقطة',W/2,y+70);x.fillStyle='#8C6670';x.font='500 22px '+F;x.fillText('شكراً على الزيارة 💛',W/2,H-30);
 const name='Morango-recu-'+(h.no||i)+'.png';const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const file=new File([blob],name,{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Morango'});return}catch(e){if(e&&e.name==='AbortError')return}}
 const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(blob);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000)}catch(e){alert('📸 ما قدرناش نحفظو الوصل، دير لقطة الشاشة (capture).')}}
const joinLink=()=>'<button class="link" onclick="location.href=location.pathname">⭐ النقاط والمشتريات ديالي</button>';
start();
</script></body></html>
