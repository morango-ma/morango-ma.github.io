<!doctype html>
<html lang="ar">
<head><meta charset="utf-8">
<title>Morango · مورانڭو</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Morango"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700;8..60,800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first; greeting + big colored action tiles on home; sticky top bar, role-based bottom tabs; every form is a bottom sheet driven by taps (choices, +/- steppers, keypad) */
:root{
  --bg:#FFF6F7; --surface:#FFFFFF; --sunk:#FBEAED; --ink:#3B1520; --muted:#8C6670; --line:#F2D8DE;
  --accent:#E02843; --accent-ink:#FFFFFF; --accent-soft:#FFDDE3;
  --c1:#FFDDE3; --c2:#FFF1CC; --c3:#F6E2F7; --c4:#E2F3E4; --c5:#D9F1DF; --c6:#FFE6D9;
  --warn:#9A6300; --warn-soft:#FFF1CC; --bad:#B8252F; --bad-soft:#FFDCDC; --good:#2B7A45; --good-soft:#D9F1DF;
  --paper:#FFFFFF; --scrim:rgba(59,21,32,.45); --leaf:#3E9B4F; --berry2:#FF7A93;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --sa:#E02843; --sp2:#6250d6; --vplan:#BDB5C9;
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:20px; --nav:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1013; --surface:#26161B; --sunk:#311D23; --ink:#FBEFF1; --muted:#C29FA8; --line:#42272F;
  --accent:#FF5B74; --accent-ink:#2A0409; --accent-soft:#4E1C27; --leaf:#6CCB7C; --berry2:#FF9AAE;
  --c1:#4E1C27; --c2:#46371A; --c3:#43203F; --c4:#1E3B27; --c5:#1B3F2B; --c6:#4A2A1D;
  --warn:#F2BE4C; --warn-soft:#46371A; --bad:#FF8A8A; --bad-soft:#4A1D22; --good:#6FD39C; --good-soft:#1B3F2B;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --sa:#FF5B74; --sp2:#9085e9; --vplan:#5E5470;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1013; --surface:#26161B; --sunk:#311D23; --ink:#FBEFF1; --muted:#C29FA8; --line:#42272F;
  --accent:#FF5B74; --accent-ink:#2A0409; --accent-soft:#4E1C27; --leaf:#6CCB7C; --berry2:#FF9AAE;
  --c1:#4E1C27; --c2:#46371A; --c3:#43203F; --c4:#1E3B27; --c5:#1B3F2B; --c6:#4A2A1D;
  --warn:#F2BE4C; --warn-soft:#46371A; --bad:#FF8A8A; --bad-soft:#4A1D22; --good:#6FD39C; --good-soft:#1B3F2B;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --sa:#FF5B74; --sp2:#9085e9; --vplan:#5E5470;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}
.viz{width:100%;height:auto;display:block;direction:ltr;overflow:visible}.viz .vgrid{stroke:var(--line);stroke-width:1}.viz .vbase{stroke:var(--muted);stroke-width:1}.viz .vax{fill:var(--muted);font-size:9px;font-family:var(--f-body)}.viz .vcross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:0}.viz .vcol:hover .vcross{opacity:.8}.viz .vcol:hover rect{fill:var(--ink);fill-opacity:.05}
.vleg{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--muted)}.vleg i,#vtip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
#vtip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.85rem;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:240px}
.hb{display:flex;flex-direction:column;gap:10px}.hbr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;border-radius:10px;padding:2px 4px}.hbr.on{background:var(--sunk)}.hbl{grid-column:1/3;font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbt{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}.hbf{height:100%;border-radius:99px}.hbv{font-size:.88rem}.hbs{grid-column:1/3;font-size:.8rem}
.tblw{overflow-x:auto}.dtbl{width:100%;border-collapse:collapse;font-size:.88rem}.dtbl th,.dtbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}.dtbl th{color:var(--muted);font-weight:700}
.stats.dk{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.bomt .bomsub td{background:var(--sunk)}
.rqx[hidden],.tlold[hidden],#pfz2[hidden]{display:none!important}#sheet[hidden],#viewer[hidden],#tabs[hidden],[hidden]{display:none!important}
.seg2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg2 .act b{font-size:.85rem}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.disp{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.num,td{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.tleft{display:flex;align-items:center;gap:8px;min-width:0}
.backbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);font-size:1.35rem;font-weight:700;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 1px 0 var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:6px}
.av{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem;flex:none;color:var(--ink)}
.mebtn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 3px 3px 12px;cursor:pointer;max-width:60%}
.mebtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem;font-weight:600}
main{padding-inline:16px;padding-block:8px calc(var(--nav) + 96px);max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hello p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.85rem}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.act{position:relative;border:0;border-radius:var(--r);padding:16px 14px;min-height:116px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;cursor:pointer;text-align:start;transition:transform .12s;color:var(--ink)}
.act:active{transform:scale(.97)}
.act .big{font-size:2.3rem;line-height:1}
.act b{font-family:var(--f-display);font-size:1.08rem;font-weight:700;line-height:1.25}
.badge{position:absolute;top:10px;inset-inline-end:10px;min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}.c6{background:var(--c6)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:0;background:var(--sunk);border-radius:14px;padding:12px 16px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{padding:7px 12px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:wait}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.link{background:none;border:0;color:var(--accent);padding:0;cursor:pointer;font-weight:700;font-size:.88rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}
.sheet-stats .stat{background:var(--bg)}
.stat span{font-size:.8rem;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.list li:first-child{border-top:0}
.list li > div{min-width:0}
.lead{display:flex;align-items:center;gap:10px;min-width:0}
.lead .em{font-size:1.6rem;flex:none}
.clk{cursor:pointer}
.alert{border-radius:16px;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--warn-soft)}
.alert.bad{background:var(--bad-soft)}.alert.acc{background:var(--c4)}
.alert .em{font-size:1.5rem}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line)}
td.pos,.pos{color:var(--good)} td.neg,.neg{color:var(--bad);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.prod{position:relative;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.prod .em{font-size:2.2rem;line-height:1.1}
.prod .pimg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;max-width:100%;background:var(--sunk)}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:10px;flex:none;background:var(--sunk)}
.iphoto{width:100%;max-width:260px;aspect-ratio:1/1;object-fit:cover;border-radius:16px;display:block;margin:auto;background:var(--sunk)}
.prod b{font-size:.88rem;line-height:1.3;font-weight:600}
.prod .p{color:var(--accent);font-weight:700;font-family:var(--f-display)}
.prod .q{font-size:.72rem;color:var(--muted)}
.prod.out{opacity:.5}
.prod.in{border-color:var(--accent)}
.prod .badge{top:6px;inset-inline-end:6px;min-width:24px;height:24px;font-size:.8rem}
.cartbar{position:fixed;inset-inline:12px;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 10px);padding:10px 12px 10px 16px;background:var(--ink);color:var(--bg);border-radius:18px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:6;max-width:736px;margin:0 auto}
.cartbar b{font-family:var(--f-display);font-size:1.2rem}
.cartbar .muted{color:inherit;opacity:.75}
nav.tabs{position:fixed;inset-inline:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:grid;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;height:var(--nav);font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs .ti{font-size:1.35rem;line-height:1;filter:grayscale(1);opacity:.65}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"] .ti{filter:none;opacity:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.88rem;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;font-size:1rem}
.big-in{font-family:var(--f-display);font-size:1.4rem!important;text-align:center}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:.82rem;font-weight:600;text-align:center;line-height:1.25;min-width:0}
.opt .ico{font-size:1.6rem;line-height:1.1}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stp{display:flex;align-items:center;gap:4px;flex:none}
.sb{width:40px;height:40px;border-radius:12px;border:0;background:var(--sunk);font-size:1.35rem;font-weight:700;cursor:pointer;display:grid;place-items:center}
.sb:last-child{background:var(--accent-soft);color:var(--accent)}
.qty{width:62px;height:40px;text-align:center;border:2px solid var(--line);background:var(--bg);border-radius:10px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;padding:0 2px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .lead div{min-width:0}
.prow .lead b{display:block;font-size:.93rem;line-height:1.3}
.err{color:var(--bad);font-size:.88rem;margin:0;font-weight:600}
#sheet,#viewer{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:760px;max-height:94%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.panel .pb{overflow-y:auto;padding:4px 16px 16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.x{background:var(--sunk);border:0;border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
#viewer img{max-width:100%;max-height:78vh;border-radius:12px;background:var(--paper);display:block;margin:auto}
canvas.sig{width:100%;height:140px;background:var(--paper);border:2px dashed var(--muted);border-radius:14px;touch-action:none}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.photo-btn{position:relative;display:flex;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:14px;padding:12px;cursor:pointer;font-weight:600;color:var(--ink)!important}
.photo-btn .em{font-size:1.6rem}
.photo-btn input{position:absolute;width:1px;height:1px;opacity:0}
.media{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);inset-inline:16px;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:40;font-weight:600;text-align:center}
.toast.bad{background:var(--bad);color:var(--paper)}
.receipt{border:2px dashed var(--line);border-radius:16px;padding:14px;background:var(--bg)}
.receipt .tot{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin-top:8px}
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:0 26px 14px 0;border-inline-start:3px solid var(--line);margin-inline-start:12px}
.steps li .dot{position:absolute;inset-inline-start:-14px;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.95rem}
.steps li.todo{opacity:.5}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:.92rem}
.empty .em{display:block;font-size:2.2rem;margin-bottom:4px}
.login{min-height:70vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:12px;text-align:center}
.login .logo{font-size:3.4rem;line-height:1}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;width:100%}
.person{border:0;background:var(--surface);border-radius:20px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.person .av{width:56px;height:56px;font-size:1.5rem}
.person b{font-size:.92rem;line-height:1.25}
.person span{font-size:.75rem;color:var(--muted)}
.pin{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:300px;margin:0 auto}
.dots{display:flex;gap:14px;direction:ltr}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.dots.show{font-family:var(--f-display);font-size:1.6rem;font-weight:800;letter-spacing:.3em;min-height:2.2rem}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;direction:ltr}
.keys button{height:62px;border:0;border-radius:18px;background:var(--surface);font-family:var(--f-display);font-size:1.6rem;font-weight:700;cursor:pointer}
.panel .keys button{background:var(--bg)}
.keys button.ghost{background:none!important}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.emojis button{font-size:1.5rem;height:44px;border-radius:12px;border:2px solid transparent;background:var(--bg);cursor:pointer}
.emojis button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.posgrid{display:flex;flex-direction:column;gap:16px;min-width:0}
.posgrid > div{display:flex;flex-direction:column;gap:16px;min-width:0}
.ticket{display:none;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden}
.ticket .th{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center}
.ticket .tl{overflow-y:auto;flex:1;padding:0 16px;min-height:120px}
.ticket .tf{padding:14px 16px;border-top:2px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.ticket .tot{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:800;font-size:1.7rem}
.paybtn{font-size:1.35rem!important;padding:16px!important}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 4px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;cursor:pointer}
.change{font-family:var(--f-display);font-weight:800;font-size:1.4rem;text-align:center;padding:10px;border-radius:14px;background:var(--good-soft);color:var(--good)}
.change.neg{background:var(--bad-soft);color:var(--bad)}
body.wide main{max-width:1280px}
@media (min-width:740px){
  body.wide .posgrid{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,34vw,370px);align-items:start}
  body.wide .ticket{display:flex;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);max-height:calc(100vh - 170px)}
  body.wide .cartbar{display:none}
  body.wide .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
  body.wide .prod{min-height:150px;justify-content:center}
  body.wide .prod .em{font-size:3rem}
  body.wide .prod b{font-size:1rem}
}

const EGG=()=>{const sp=Object.values(S.items).find(i=>i.split&&i.active!==false);if(!sp)return null;const w=Object.values(S.items).find(i=>i.egg==='white'),y=Object.values(S.items).find(i=>i.egg==='yolk');if(!w||!y)return null;return{id:sp.id,egg:sp.recipe?.lines?.[0]?.item,wg:+sp.split.white||33,yg:+sp.split.yolk||17,wid:w.id,yid:y.id}};

const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
function bioMap(){try{return JSON.parse(localStorage.getItem('bk-bio')||'{}')}catch(_){return {}}}
function bioSave(m){try{localStorage.setItem('bk-bio',JSON.stringify(m))}catch(_){}}
function bioHas(uid){return !!bioMap()[uid]}
let BIO_OK=null;(async()=>{try{BIO_OK=!!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(_){BIO_OK=false}})();

async function bioEnroll(u){const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Morango'},user:{id:new TextEncoder().encode(u.id),name:u.name,displayName:u.name},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
  const m=bioMap();m[u.id]=b64u(cred.rawId);bioSave(m)}
async function bioCheck(uid){const id=bioMap()[uid];if(!id)return false;const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub64(id),transports:['internal']}],userVerification:'required',timeout:60000}});
  const ad=new Uint8Array(a.response.authenticatorData);return !!(ad[32]&0x04)}

/* moves quantities; for incoming lines with a unit cost, re-weights the CMUP: (old qty x old avg + new qty x new cost) / total qty */
async function moveStock(loc,deltas,costs){deltas={...deltas};for(const k in deltas)if(noSt(k))delete deltas[k];const ref=db.doc('stock/'+loc);const snap=await ref.get();const dt=snap.exists?snap.data():{};const cur=dt.items||{},av=dt.avg||{};const items={},avg={};
  for(const k in deltas){const q0=cur[k]||0,q=deltas[k];if(costs&&costs[k]!=null&&q>0){const base=Math.max(q0,0);const a0=av[k]!=null?+av[k]:+costs[k];avg[k]=Math.round(((base*a0+q*costs[k])/(base+q))*10000)/10000}items[k]=r2(q0+q)}
  const upd={items};if(Object.keys(avg).length)upd.avg=avg;if(snap.exists)await ref.update(upd);else await ref.set(upd);return{before:cur,after:items}}
const bumpStock=(loc,deltas)=>moveStock(loc,deltas,null);
async function setStockVals(loc,vals){const ref=db.doc('stock/'+loc);const snap=await ref.get();const before=snap.exists?(snap.data().items||{}):{};const items={};for(const k in vals)items[k]=r2(vals[k]);if(snap.exists)await ref.update({items});else await ref.set({items});return{before,after:items}}

function loyRedeemUnused(points,total){const L=LOY();if(!L.on||!(+L.redeemPts>0))return{units:0,pts:0,val:0};let units=Math.floor((+points||0)/L.redeemPts);units=Math.min(units,Math.floor(total/L.redeemVal));return{units,pts:units*L.redeemPts,val:r2(units*L.redeemVal)}}

/* ---------- PIN pad ---------- */
function pinPad(id,{show=false,onDone=null}={}){PINCB[id]=onDone;return `<div class="pin" data-pin="${id}" data-show="${show?1:0}"><div class="dots ${show?'show':''}" id="dots-${id}"></div><div class="keys">${[1,2,3,4,5,6,7,8,9].map(k=>`<button type="button" data-act="pk" data-pin="${id}" data-k="${k}">${k}</button>`).join('')}<button type="button" class="ghost" data-act="pk" data-pin="${id}" data-k="clr" aria-label="مسح الكل">✕</button><button type="button" data-act="pk" data-pin="${id}" data-k="0">0</button><button type="button" class="ghost" data-act="pk" data-pin="${id}" data-k="del" aria-label="مسح رقم">⌫</button></div><input type="hidden" id="${id}" name="${id}" value=""></div>`}
function pinRender(id){const inp=$('#'+id),box=$('#dots-'+id),p=$(`.pin[data-pin="${id}"]`);if(!inp||!box||!p)return;const v=inp.value;box.innerHTML=p.dataset.show==='1'?(v?esc(v)+'<span class="muted">'+'•'.repeat(4-v.length)+'</span>':'<span class="muted">••••</span>'):[0,1,2,3].map(i=>`<i class="${i<v.length?'on':''}"></i>`).join('')}
function pinKey(id,k){const inp=$('#'+id);if(!inp)return;let v=inp.value;if(k==='del')v=v.slice(0,-1);else if(k==='clr')v='';else if(v.length<4)v+=k;inp.value=v;pinRender(id);if(v.length===4&&PINCB[id])PINCB[id](v)}
function pinReset(id,shake){const inp=$('#'+id);if(!inp)return;inp.value='';pinRender(id);if(shake){const b=$('#dots-'+id);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}
function mountPins(){$$('.pin[data-pin]').forEach(p=>pinRender(p.dataset.pin))}

async function tryLogin(u,pin){
  const e=$('#loginerr');if(S.lockUntil>Date.now()){pinReset('loginpin',true);return}
  const h=await hashPin(u.id,pin);
  if(h===u.hash){devClaim(u);S.tries=0;try{localStorage.setItem('bk-uid',u.id)}catch(_){}S.loginUser=null;S.view='home';setMe();render();toast(greet()+' '+u.name+' 👋')}
  else{S.tries++;if(S.tries>=5){S.lockUntil=Date.now()+30000;S.tries=0}pinReset('loginpin',true);if(e){e.textContent=S.lockUntil>Date.now()?'بزاف ديال المحاولات. تسنى 30 ثانية وعاود.':'الكود غالط، عاود.';e.hidden=false}}
}
/* in-app back: photo viewer, then open sheet, then previous screen, then home. Never leaves the app. */
function doBack(){
  if(!$('#viewer').hidden){$('#viewer').hidden=true;return}
  if(!$('#sheet').hidden){closeSheet();return}
  if(!me){if(S.loginUser){S.loginUser=null;render()}return}
  if(S.hist.length){S.view=S.hist.pop();window.scrollTo(0,0);render();return}
  if(S.view!=='home'){S.view='home';window.scrollTo(0,0);render()}
}
/* the phone's own back button: keep one guard entry so back stays inside the app */
function guardBack(){try{history.pushState({bk:1},'')}catch(_){}}
window.addEventListener('popstate',()=>{doBack();guardBack()});
function logout(){S.hist=[];try{localStorage.removeItem('bk-uid')}catch(_){}me=null;S.loginUser=null;S.cart={};closeSheet();render()}

function explode(id,mult,path,acc,d=0){const it=S.items[id];if(!it||d>10)return;

  const y=yld(it);for(const l of it.recipe.lines)explode(l.item,cq(l,lineQty(l)*mult/y),[...path,it.name],acc,d+1)}

const qtyU=(q,it)=>{const u=it?.unit||'';if(isW(u))return qtyTxt(q,u);const w=uwG(it);return fmtq(Math.round(q*1000)/1000)+' '+u+(w>0?' <span class="muted">(≈ '+qtyTxt(q*w/1000,'كغ')+')</span>':'')};

    return head+(sub?bomTree(l.item,q,d+1):'')}).join('')}

function wsRawMap(){const M={};WS.forEach(w=>M[w.id]=new Set());const walk=(id,w,d)=>{const it=S.items[id];if(!it||d>8)return;if(it.kind==='raw'){M[w].add(id);return}(it.recipe?.lines||[]).forEach(l=>walk(l.item,w,d+1))};

/* ---------- receipt image for thermal printers (58mm = 384px, 80mm = 576px wide) ---------- */
async function receiptBlob(sh,t){
  const cfg=S.cfg||{};const W=cfg.width==='58'?384:576;const P=W>400?22:14;const F=W>400?24:19;const FONT='"IBM Plex Sans Arabic",Tahoma,sans-serif';
  try{await Promise.all([document.fonts.load(`600 ${F}px "IBM Plex Sans Arabic"`),document.fonts.load(`400 ${F}px "IBM Plex Sans Arabic"`)])}catch(_){}
  const cv=document.createElement('canvas');const x=cv.getContext('2d');const font=(sz,b)=>`${b?700:400} ${sz}px ${FONT}`;
  const wrap=(txt,sz,b,maxW)=>{x.font=font(sz,b);const words=String(txt).split(/\s+/);const out=[];let cur='';for(const w of words){const tr=cur?cur+' '+w:w;if(x.measureText(tr).width>maxW&&cur){out.push(cur);cur=w}else cur=tr}if(cur)out.push(cur);return out.length?out:['']};
  const R=[];const center=(txt,sz,b)=>wrap(txt,sz,b,W-2*P).forEach(l=>R.push({k:'c',t:l,sz,b}));
  const pair=(r,l,sz,b)=>{x.font=font(sz,b);const lw=x.measureText(l).width;const rl=wrap(r,sz,b,W-2*P-lw-12);rl.forEach((t2,i)=>R.push({k:'p',r:t2,l:i===rl.length-1?l:'',sz,b}))};
  const line=()=>R.push({k:'l'}),gap=h=>R.push({k:'g',h});
  center(cfg.title||'MORANGO',Math.round(F*1.45),true);if(cfg.address)center(cfg.address,Math.round(F*.8));if(cfg.phone)center('☎ '+cfg.phone,Math.round(F*.8));
  center(LOC[sh.pos],Math.round(F*.85));gap(6);line();
  pair('وصل رقم '+t.n,dhm(t.ts),Math.round(F*.85),true);pair('البائعة: '+sh.seller,'',Math.round(F*.8));line();
  t.lines.forEach(l=>{pair(iname(l.item),money(l.qty*l.price).replace(' د.م',''),F,true);R.push({k:'p',r:fmt(l.qty)+' × '+money(l.price),l:'',sz:Math.round(F*.78),b:false,mut:true})});
  line();if(t.discount)pair('خصم الوفاء','-'+money(t.discount),Math.round(F*.85));pair('المجموع',money(t.total),Math.round(F*1.35),true);
  if(t.given!=null){pair('عطى الزبون',money(t.given),Math.round(F*.85));pair('الصرف',money(t.change),Math.round(F*.85))}
  pair('طريقة الأداء','كاش',Math.round(F*.8));
  if(t.client){line();center('⭐ '+t.client.name,Math.round(F*.85),true);pair('النقاط ديال اليوم','+'+fmt(t.client.earned),Math.round(F*.8));pair('الرصيد ديالك',fmt(t.client.balance)+' نقطة',Math.round(F*.8),true)}line();gap(4);center(cfg.footer||'شكراً على الزيارة',Math.round(F*.9),true);gap(P);
  const lh=r=>r.k==='l'?20:r.k==='g'?r.h:Math.round(r.sz*1.45);let H=P;R.forEach(r=>H+=lh(r));
  cv.width=W;cv.height=H;x.fillStyle='#FFFFFF';x.fillRect(0,0,W,H);x.fillStyle='#000000';x.strokeStyle='#000000';x.textBaseline='middle';let y=P;
  for(const r of R){const h=lh(r);const mid=y+h/2;
    if(r.k==='l'){x.setLineDash([8,6]);x.lineWidth=2;x.beginPath();x.moveTo(P,mid);x.lineTo(W-P,mid);x.stroke();x.setLineDash([])}
    else if(r.k==='c'){x.font=font(r.sz,r.b);x.direction='rtl';x.textAlign='center';x.fillText(r.t,W/2,mid)}
    else if(r.k==='p'){x.font=font(r.sz,r.b);x.fillStyle=r.mut?'#444444':'#000000';x.direction='rtl';x.textAlign='right';x.fillText(r.r,W-P,mid);if(r.l){x.direction='ltr';x.textAlign='left';x.fillText(r.l,P,mid)}x.fillStyle='#000000'}
    y+=h}
  return await new Promise(res=>cv.toBlob(res,'image/png'));
}

function perRange(id){const t=new Date();if(id==='today')return{from:today(),days:1};if(id==='month'){const f=new Date(t.getFullYear(),t.getMonth(),1);return{from:dstr(f),days:t.getDate()}}const n=+id;return{from:daysAgo(n-1),days:n}}
async function loadReport(){const R=S.rep;const {from}=perRange(R.per);R.loading=true;render();
  try{const [sh,op]=await Promise.all([db.collection('shifts').where('date','>=',from).get(),db.collection('ops').where('date','>=',from).get()]);
    R.data={per:R.per,shifts:sh.docs.map(d=>d.data()),ops:op.docs.map(d=>d.data())}}catch(e){R.data=null;toast('ما قدرناش نحملو التقرير',true)}R.loading=false;render()}
function computeReport(){const D=S.rep.data;if(!D)return null;const {days}=perRange(D.per);
  const W={};WS.forEach(w=>W[w.id]={sales:0,cogs:0,loss:0,charges:0,items:{},lossBy:{destroy:0,count:0,transfer:0,adjust:0,inv:0}});
  const wsOf=id=>S.items[id]?.ws||null;const item=(w,id)=>W[w].items[id]||(W[w].items[id]={qty:0,sales:0,cogs:0});
  D.shifts.forEach(sh=>(sh.tickets||[]).forEach(t=>{const gross=t.lines.reduce((s,l)=>s+l.qty*l.price,0)||1;const disc=+t.discount||0;
    t.lines.forEach(l=>{const w=wsOf(l.item);if(!W[w])return;const rev=l.qty*l.price-disc*(l.qty*l.price/gross);const uc=l.unitCost!=null?+l.unitCost:costOf(l.item,0,sh.pos);
      const pc=+l.packCost||0;W[w].sales+=rev;W[w].cogs+=l.qty*uc+pc;W[w].pack=(W[w].pack||0)+pc;const it=item(w,l.item);it.qty+=l.qty;it.sales+=rev;it.cogs+=l.qty*uc+pc})}));
  const addLoss=(w,k,v)=>{if(!W[w]||!v)return;W[w].loss+=v;W[w].lossBy[k]+=v};
  D.ops.forEach(o=>{
    if(o.type==='return'&&o.status==='decided')(o.decisions||[]).forEach(x=>{if(x.destroy)addLoss(o.ws,'destroy',x.destroy*costOf(x.item,0,o.ws))});
    if(o.type==='count')(o.diffs||[]).forEach(d=>addLoss(wsOf(d.item),'count',-d.d*costOf(d.item,0,o.pos)));
    if(o.type==='transfer'&&o.hasDiff)(o.diff||[]).forEach(d=>{const sl=(o.lines||[]).find(l=>l.item===d.item);addLoss(o.ws,'transfer',-d.d*(sl?.unitCost!=null?+sl.unitCost:costOf(d.item,0,o.ws)))});
    if(o.type==='adjust'){const loc=o.ws||o.pos;const w=o.ws||wsOf(o.item);addLoss(w,'adjust',(o.from-o.to)*costOf(o.item,0,loc))}});
  S.invs.filter(x=>x.date>=perRange(D.per).from).forEach(x=>addLoss(x.ws,'inv',-(+x.totalVal||0)));
  const from=perRange(D.per).from,to=today();let overhead=0;const ohBy={};
  S.chg.forEach(c=>{const v=chargeShare(c,from,to);if(!v)return;if(c.cat==='salaries'&&W[c.ws]){W[c.ws].direct=(W[c.ws].direct||0)+v;const sb=W[c.ws].paySub||(W[c.ws].paySub={});sb[c.sub||'base']=(sb[c.sub||'base']||0)+v}else{overhead+=v;ohBy[c.cat]=(ohBy[c.cat]||0)+v}});
  S.packinvs.filter(x=>x.date>=from).forEach(x=>{const v=+x.value||0;if(v>0){overhead+=v;ohBy.packaging=(ohBy.packaging||0)+v}});
  const totalSales=WS.reduce((s,w)=>s+W[w.id].sales,0);const rate=totalSales>0?overhead/totalSales:0;
  WS.forEach(w=>{const x=W[w.id];x.direct=x.direct||0;x.share=totalSales>0?x.sales/totalSales:0;x.overhead=overhead*x.share;x.charges=x.direct+x.overhead;x.gross=x.sales-x.cogs-x.loss;x.net=x.gross-x.charges;
    x.absorbed=0;D.ops.forEach(o=>{if(o.type==='production'&&o.ws===w.id&&o.date<=to)x.absorbed+=+o.labor||0});x.payroll=x.direct;x.direct=x.payroll-x.absorbed;x.charges=x.direct+x.overhead;x.net=x.gross-x.charges;
    x.alloc=allocOf(w.id);const B={};let bt=0;if(x.alloc!=='sales')D.ops.forEach(o=>{if(o.type!=='production'||o.ws!==w.id)return;const pi=S.items[o.item];if(pi?.kind!=='final')return;const q=+o.qty||0;const b=q*basisU(pi,x.alloc);const it=item(w.id,o.item);it.prod=(it.prod||0)+q;if(b>0){B[o.item]=(B[o.item]||0)+b;bt+=b}});
    x.allocUsed=bt>0?x.alloc:'sales';
    Object.entries(x.items).forEach(([id,it])=>{it.overhead=it.sales*rate;it.direct=x.allocUsed==='sales'?(x.sales>0?x.direct*it.sales/x.sales:0):x.direct*(B[id]||0)/bt;it.laborUnit=it.direct>0?it.direct/((x.allocUsed==='sales'?it.qty:it.prod)||1):0;it.net=it.sales-it.cogs-it.overhead-it.direct})});
  return {W,days,overhead,ohBy,rate,totalSales,unallocated:totalSales>0?0:overhead}}
function vReport(){if(!isAdmin())return emptyB('🔒','غير المشرف العام اللي يشوف هاد التقرير.');

    ${computeReport().rate>0?`<div class="muted">كل 100 د.م ديال البيع كتحمل <b>${fmt(computeReport().rate*100)} د.م</b> ديال المصاريف العامة.</div>`:''}<span class="link">💼 دخل ولا بدل المصاريف ←</span></section>
   ${[...WS].sort((a,b)=>W[b.id].net-W[a.id].net).map(card).join('')}
   <p class="muted">🧾 المبيعات بعد خصم الوفاء · 🌾 التكلفة بالـCMUP · 🗑️ الخسائر = الإتلاف، فروقات الجرد والاستلام، والتصحيحات · 👥 الأجور المباشرة ديال الورشة · 💼 المصاريف العامة موزعة حسب الحصة من المبيعات. كل مصروف شهري كيتقسم على أيام الشهر.</p>`}

async function consumeLots(loc,cons,ref){const used=[];for(const c of cons){let need=+c.qty||0;if(!(need>0))continue;for(const l of lotsActive(loc,c.item)){if(need<=1e-9)break;const t=Math.min(+l.qty||0,need);if(!(t>0))continue;const left=r2((+l.qty||0)-t);need=r2(need-t);
