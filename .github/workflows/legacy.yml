name: Build legacy page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'tools/legacy.mjs', '.github/workflows/legacy.yml']
permissions: { contents: write }
concurrency: { group: legacy, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save esbuild@0.24.0 @supabase/supabase-js@2.45.4
      - run: node tools/legacy.mjs
      - run: |
          git config user.name "morango-bot"; git config user.email "bot@morango.ma"
          git add legacy.html supabase-legacy.js
          git diff --cached --quiet || (git commit -m "Build legacy page" && git pull --rebase -q && git push)
