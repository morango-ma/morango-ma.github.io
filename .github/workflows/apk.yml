name: Build Android APK (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['twa/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: twa
        run: gradle --no-daemon assembleRelease
      - name: Publish release asset
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp twa/app/build/outputs/apk/release/app-release-unsigned.apk morango-unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          mkdir -p stools && cp $BT/lib/apksigner.jar $BT/zipalign stools/ && (cp $BT/lib64/libc++.so stools/ 2>/dev/null || true) && tar czf signtools.tgz -C stools .
          TAG="apk-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" morango-unsigned.apk signtools.tgz --title "APK build ${GITHUB_RUN_NUMBER}" --notes "Unsigned build" --prerelease
