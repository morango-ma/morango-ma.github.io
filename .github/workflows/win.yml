name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/win.yml']
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - flavor: modern
            electron: '33.2.1'
            artifact: Morango-Setup.exe
          - flavor: legacy
            electron: '22.3.27'
            artifact: Morango-Setup-Win7.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build
        working-directory: desktop
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --save-dev electron@${{ matrix.electron }}
          npx electron-builder --win nsis --x64 --ia32 --publish never -c.electronVersion=${{ matrix.electron }} -c.nsis.artifactName=${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.flavor }}', path: 'desktop/dist/${{ matrix.artifact }}' }
  release:
    needs: win
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete win-latest -y --cleanup-tag || true
          gh release create win-latest out/modern/Morango-Setup.exe out/legacy/Morango-Setup-Win7.exe --title "Morango pour Windows" --notes "Build ${GITHUB_RUN_NUMBER}: Morango-Setup.exe (Windows 10/11), Morango-Setup-Win7.exe (Windows 7/8/8.1). 32 et 64 bits." --prerelease
